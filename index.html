<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AEC Live Trade Dashboard</title>
<style>
    body { font-family: -apple-system, sans-serif; background:#0d1117; color:#e6edf3; padding:30px; margin:0; }
    h1 { font-size: 22px; }
    .stats { display:flex; gap:20px; margin:20px 0; flex-wrap:wrap; }
    .card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:16px 24px; }
    .card .label { font-size:12px; color:#8b949e; text-transform:uppercase; }
    .card .value { font-size:24px; font-weight:bold; margin-top:4px; }
    table { border-collapse:collapse; width:100%; margin-top:20px; font-size:13px; }
    th, td { text-align:left; padding:8px 12px; border-bottom:1px solid #30363d; }
    th { color:#8b949e; text-transform:uppercase; font-size:11px; }
    .note { color:#8b949e; font-size:12px; margin-top:20px; }
    .win { color:#4ade80; font-weight:bold; }
    .loss { color:#f87171; font-weight:bold; }
</style>
</head>
<body>
    <h1>AEC Live Trade Dashboard (Book 1 -- NQ)</h1>
    <div class="stats" id="stats">Loading trade_log.csv...</div>
    <table id="tradeTable">
        <tr><th>Entry Time</th><th>Symbol</th><th>Side</th><th>Entry</th><th>Exit</th><th>Qty</th><th>P&amp;L</th><th>Reason</th></tr>
    </table>
    <p class="note">Reads trade_log.csv from this same repo. Updates whenever a fresh copy of that
    file is pushed to GitHub -- not continuously live like the local dashboard version.
    Shows CLOSED trades only.</p>

<script>
async function loadDashboard() {
    try {
        const response = await fetch('trade_log.csv?t=' + Date.now()); // cache-bust
        if (!response.ok) throw new Error('trade_log.csv not found in this repo yet');
        const text = await response.text();
        const lines = text.trim().split('\n');
        const headers = lines[0].split(',');
        const trades = [];
        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',');
            if (cols.length < headers.length) continue;
            const row = {};
            headers.forEach((h, idx) => row[h.trim()] = cols[idx]);
            const pnl = parseFloat(row.pnl);
            if (!isNaN(pnl)) {
                row.pnl = pnl;
                trades.push(row);
            }
        }

        if (trades.length === 0) {
            document.getElementById('stats').innerHTML = '<div class="card"><div class="label">Status</div><div class="value">No trades yet</div></div>';
            return;
        }

        const wins = trades.filter(t => t.pnl > 0);
        const losses = trades.filter(t => t.pnl <= 0);
        const totalPnl = trades.reduce((sum, t) => sum + t.pnl, 0);
        const winRate = (100 * wins.length / trades.length).toFixed(1);
        const avgWin = wins.length ? (wins.reduce((s, t) => s + t.pnl, 0) / wins.length) : 0;
        const avgLoss = losses.length ? (losses.reduce((s, t) => s + t.pnl, 0) / losses.length) : 0;
        const pnlColor = totalPnl >= 0 ? '#4ade80' : '#f87171';

        document.getElementById('stats').innerHTML = `
            <div class="card"><div class="label">Total P&amp;L</div><div class="value" style="color:${pnlColor}">$${totalPnl.toFixed(2)}</div></div>
            <div class="card"><div class="label">Trades</div><div class="value">${trades.length}</div></div>
            <div class="card"><div class="label">Win Rate</div><div class="value">${winRate}%</div></div>
            <div class="card"><div class="label">Avg Win</div><div class="value" style="color:#4ade80">$${avgWin.toFixed(2)}</div></div>
            <div class="card"><div class="label">Avg Loss</div><div class="value" style="color:#f87171">$${avgLoss.toFixed(2)}</div></div>
        `;

        const table = document.getElementById('tradeTable');
        const recent = trades.slice(-30).reverse();
        let rows = '<tr><th>Entry Time</th><th>Symbol</th><th>Side</th><th>Entry</th><th>Exit</th><th>Qty</th><th>P&amp;L</th><th>Reason</th></tr>';
        recent.forEach(t => {
            const cls = t.pnl > 0 ? 'win' : 'loss';
            rows += `<tr>
                <td>${(t.entry_timestamp || '').substring(0,19)}</td>
                <td>${t.symbol || ''}</td>
                <td>${t.side || ''}</td>
                <td>${t.entry_price || ''}</td>
                <td>${t.exit_price || ''}</td>
                <td>${t.qty || ''}</td>
                <td class="${cls}">$${t.pnl.toFixed(2)}</td>
                <td>${t.notes || ''}</td>
            </tr>`;
        });
        table.innerHTML = rows;

    } catch (err) {
        document.getElementById('stats').innerHTML = `<div class="card"><div class="label">Error</div><div class="value" style="font-size:14px;">${err.message}</div></div>`;
    }
}

loadDashboard();
setInterval(loadDashboard, 15000); // re-check every 15s in case the page is left open after a fresh push
</script>
</body>
</html>
